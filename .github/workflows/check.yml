name: Precommit

on:
  push:
    branches: 
      - trunk
  pull_request:
    branches: 
      - trunk

jobs:
  build:
    strategy:
      matrix:
        compiler:
          - gcc
          - clang
        optimization_level: 
          - -O0
          - -O3
        sanitizers:
          - ''
          - 'address,leak'

    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install build-essential
          sudo apt install gcc
          sudo apt install clang clang-format clang-tidy
          sudo apt install bear

      - name: Create log directory
        run: mkdir -p log

      - name: Build
        run: make compile

      - name: Test
        run: make

      - name: Check Format
        run: make check-format

      - name: Check Style
        run: make check-style

      - name: Run precommit
        run: ./ci/precommit.bash
